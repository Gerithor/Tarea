<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Actividad 3</title>
</head>
<body>
  <h1 id="titulo">Título original</h1>
  <button onclick="cambiarTitulo()">Cambiar título</button>

  <script>
    function cambiarTitulo() {
      var elem = document.getElementById("titulo");
      if (elem) elem.textContent = "Título cambiado con JavaScript";
    }
  </script>
</body>
</html>
