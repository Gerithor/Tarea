<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Edad</title>
</head>
<body>
    <h1>Validar Edad</h1>
    <input type="number" id="edad" placeholder="Ingresa tu edad">
    <button onclick="verificarEdad()">Verificar edad</button>
    <p id="mensaje"></p>

    <script>
        function verificarEdad() {
            const valor = document.getElementById("edad").value;
            const mensaje = document.getElementById("mensaje");

            if (valor === "") {
                mensaje.textContent = "Por favor escribe tu edad.";
                return;
            }

            const edad = Number(valor);
            if (edad >= 18) {
                mensaje.textContent = "Eres mayor de edad.";
            } else {
                mensaje.textContent = "Eres menor de edad.";
            }
        }
    </script>
</body>
</html>
